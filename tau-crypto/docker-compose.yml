# Everything for tau-crypto runs in these containers (see ./dev).
# The host only holds the source folder and its outputs; tools, node_modules,
# caches and the verthash dataset live in images and named volumes.
name: tau-crypto

services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: tau-crypto-dev:local
    working_dir: /src
    init: true
    shm_size: 1gb          # headless Chromium
    environment:
      CMO_CACHE: /cache
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - .:/src
      - ../cpuminer-opt:/upstream:ro
      - node_modules:/src/node_modules
      - emcache:/emsdk/upstream/emscripten/cache
      - cache:/cache

  ref-amd64:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/Dockerfile.ref-amd64
    image: tau-crypto-ref-amd64:local
    working_dir: /src
    init: true
    environment:
      CMO_CACHE: /cache
    volumes:
      - .:/src
      - cache:/cache

volumes:
  node_modules:
  emcache:
  cache:
