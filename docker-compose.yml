# The containers for server/ (see server/dev): its tests, the website build and
# the Worker bundles. `app` reuses the library's dev image (Node 26, Chromium);
# build it once with `tau-crypto/dev setup`. `bitcoind` is a private regtest
# chain for tests only: no peers, no real network. The library has its own
# containers (tau-crypto/docker-compose.yml).
name: project-tau

services:
  app:
    image: tau-crypto-dev:local
    working_dir: /repo/server
    init: true
    shm_size: 1gb
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # wrangler and Next.js: no usage telemetry from this machine
      WRANGLER_SEND_METRICS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      BITCOIND_RPC: http://bitcoind:18443
      BITCOIND_USER: tau
      BITCOIND_PASS: tau
    volumes:
      - .:/repo
      - node_modules:/repo/server/node_modules
      - site_node_modules:/repo/server/site/node_modules

  bitcoind:
    build: server/docker/bitcoind
    image: project-tau-bitcoind:local
    command:
      - -regtest
      - -server
      - -listen=0
      - -connect=0
      - -dnsseed=0
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=tau
      - -rpcpassword=tau
      - -printtoconsole=0

volumes:
  node_modules:
  site_node_modules:
