# Everything for the top-level project runs in these containers (see ./dev).
# `app` reuses the tau-crypto dev image (Node 26, Chromium); build it once
# with `tau-crypto/dev setup`. `bitcoind` is a private regtest chain for
# tests only: no peers, no real network.
name: project-tau

services:
  app:
    image: tau-crypto-dev:local
    working_dir: /repo
    init: true
    shm_size: 1gb
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # wrangler and Next.js: no usage telemetry from this machine
      WRANGLER_SEND_METRICS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      BITCOIND_RPC: http://bitcoind:18443
      BITCOIND_USER: tau
      BITCOIND_PASS: tau
    volumes:
      - .:/repo
      - node_modules:/repo/node_modules
      - site_node_modules:/repo/site/node_modules

  bitcoind:
    build: docker/bitcoind
    image: project-tau-bitcoind:local
    command:
      - -regtest
      - -server
      - -listen=0
      - -connect=0
      - -dnsseed=0
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=tau
      - -rpcpassword=tau
      - -printtoconsole=0

volumes:
  node_modules:
  site_node_modules:
